<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Share-card metadata, placed FIRST in <head> on purpose. Some link-preview
      generators (notably Messenger's on-device preview for end-to-end-encrypted
      chats, which builds the card on the phone rather than on Facebook's
      servers) read only the first slice of <head> and skip pages where the
      tags sit far down. Keeping them ahead of the comments, font preload and
      title makes the preview resolve reliably across scrapers.

      Deliberately carries the couple names only. The ceremony date and venue
      names are omitted (requirement 1.4 forbids them being readable before the
      envelope is opened). The share image is the couple's wedding logo on a
      cream card (no date, no venue), served from /public at a stable, unhashed
      root path so a crawler can fetch it at an absolute URL. og:image MUST be
      an absolute URL, so the production domain is written out in full. The
      `?v=` on the image URL is a cache-buster: bump it whenever the image
      bytes change so Messenger/Facebook fetch the new file instead of a stale
      cached copy.
    -->
    <meta
      name="description"
      content="An invitation to the wedding of Bricx &amp; Hannah. Open the envelope to see the details."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bricxhannah-wedding.vercel.app/" />
    <meta property="og:title" content="Bricx &amp; Hannah — Wedding Invitation" />
    <meta
      property="og:description"
      content="An invitation to the wedding of Bricx &amp; Hannah. Open the envelope to see the details."
    />
    <meta
      property="og:image"
      content="https://bricxhannah-wedding.vercel.app/share-card.png?v=2"
    />
    <meta
      property="og:image:secure_url"
      content="https://bricxhannah-wedding.vercel.app/share-card.png?v=2"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The wedding logo of Bricx &amp; Hannah."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bricx &amp; Hannah — Wedding Invitation" />
    <meta
      name="twitter:description"
      content="An invitation to the wedding of Bricx &amp; Hannah. Open the envelope to see the details."
    />
    <meta
      name="twitter:image"
      content="https://bricxhannah-wedding.vercel.app/share-card.png?v=2"
    />

    <!-- Favicon is a local inline-simple SVG in Palette colours. No external request. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Preload the one self-hosted display webfont (Parisienne) so the browser
      fetches it up front and the @font-face in index.css can swap it in as
      early as possible. Served from /public at a stable, unhashed path, so this
      absolute URL is valid in both dev and the production build. Same-origin,
      so `crossorigin` is still required for font preloads to be reused.
    -->
    <link
      rel="preload"
      href="/fonts/parisienne-v14-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <title>Bricx &amp; Hannah — Wedding Invitation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      RSVP STATIC FALLBACK FORM — DO NOT DELETE. This is not dead code.

      Why it exists:
        The live RSVP form is rendered by React inside #root. This static copy
        is a no-JavaScript fallback: it posts the same fields to the same
        endpoint (`/api/rsvp`, the Vercel serverless function in api/rsvp.js),
        so a guest whose JavaScript fails can still submit. It also pins the
        canonical field-name set the whole RSVP path agrees on (a test asserts
        the field names here match what the client encoder posts, so the live
        form, this stub, and the endpoint cannot drift apart).

      Why it lives here and not inside #root:
        React's reconciler owns everything under #root. Anything placed there
        would be wiped on the first render and could collide with the live
        form's DOM. As a sibling it is invisible to React and permanent.

      Why it does not breach requirement 1.4:
        It carries field NAMES only — no couple name, no ceremony date, no
        venue name, no readable label text. Four independent layers keep it out
        of rendering, out of the accessibility tree, out of find-in-page and
        out of tab order: `hidden`, `display: none`, `aria-hidden`, `inert`,
        plus `tabindex="-1"` on every control. It survives a stylesheet
        failure.

      Field names must stay in lockstep with the live form in src/components/
      Rsvp.jsx and the endpoint in api/rsvp.js (form-name, guestName,
      attendance, guestCount, message). A test asserts that agreement, so do
      not rename one side alone.
    -->
    <form
      name="rsvp"
      method="POST"
      action="/api/rsvp"
      hidden
      inert
      aria-hidden="true"
      style="display:none"
    >
      <input type="hidden" name="form-name" value="rsvp" />
      <input type="text" name="guestName" tabindex="-1" />
      <input type="text" name="attendance" tabindex="-1" />
      <input type="number" name="guestCount" tabindex="-1" />
      <textarea name="message" tabindex="-1"></textarea>
    </form>
  </body>
</html>
